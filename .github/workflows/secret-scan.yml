# 2026-11-23 追加: 公開リポの鍵検査（全 push・全 PR）。
# ローカルの pre-commit は --no-verify や bot のコミットで素通りするため、サーバ側で必ず止める。
# 候補が1つでもあれば失敗する（値は表示しない）。
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tree and history
        run: python3 scripts/secret_scan_ci.py .
